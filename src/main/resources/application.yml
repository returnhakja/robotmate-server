spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:robotmate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:please-change-this-secret-key-in-production-min-32-chars}
  expiration: 86400000      # 24시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:robotmate-images}
    public-url: ${R2_PUBLIC_URL:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

cors:
  allowed-origins: http://localhost:3000,https://robotmate.kr,https://www.robotmate.kr
